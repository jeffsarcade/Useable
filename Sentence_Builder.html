<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: one sheet of ruled paper holds the sentence; highlighter colors mark each added part; controls sit below and never move. */
  --paper: #eef1f6;
  --sheet: #ffffff;
  --ink: #16203a;
  --muted: #586380;
  --line: #d3d9e5;
  --accent: #2242cf;
  --on-accent: #ffffff;
  --margin-rule: #e58a9a;
  --good: #17734a;
  --bad: #b3261e;
  --hl-s: 92%;
  --hl-l: 83%;
  --dot-s: 78%;
  --dot-l: 44%;
  --comp-bg: #dfe3ec;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-sentence: "Source Serif 4", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0e1320;
    --sheet: #161c2e;
    --ink: #e9ecf5;
    --muted: #9ba5bd;
    --line: #2b3450;
    --accent: #93a6ff;
    --on-accent: #0e1320;
    --margin-rule: #8a4352;
    --good: #6fd3a2;
    --bad: #ff9a8f;
    --hl-s: 58%;
    --hl-l: 27%;
    --dot-s: 72%;
    --dot-l: 64%;
    --comp-bg: #2a3350;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0e1320;
  --sheet: #161c2e;
  --ink: #e9ecf5;
  --muted: #9ba5bd;
  --line: #2b3450;
  --accent: #93a6ff;
  --on-accent: #0e1320;
  --margin-rule: #8a4352;
  --good: #6fd3a2;
  --bad: #ff9a8f;
  --hl-s: 58%;
  --hl-l: 27%;
  --dot-s: 72%;
  --dot-l: 64%;
  --comp-bg: #2a3350;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0;
  font-size: clamp(1.7rem, 5vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
}
.tabs { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px; gap: 3px; }
.tabs button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 7px 14px; font-weight: 600; font-size: .92rem;
}
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--sheet); }

.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.picker .lead { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 4px; }
.picker button {
  border: 1.5px solid var(--line); background: var(--sheet); border-radius: 8px;
  min-width: 38px; height: 38px; padding: 0 8px; font-size: .92rem; font-variant-numeric: tabular-nums;
}
.picker button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet); font-weight: 800; }

/* The sheet */
.sheet {
  position: relative;
  background: var(--sheet);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  padding: 22px 18px 16px 34px;
}
.sheet::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 20px;
  width: 1.5px; background: var(--margin-rule);
}
.sentence {
  font-family: var(--font-sentence);
  font-size: clamp(1.45rem, 4.4vw, 2.25rem);
  line-height: 1.8;
  margin: 0;
  overflow-wrap: break-word;
}
.measure { position: absolute; visibility: hidden; pointer-events: none; left: 34px; right: 18px; top: 0; }

.seg {
  --hue: 0;
  padding: .06em .14em;
  border-radius: 5px;
  cursor: pointer;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  background: hsl(var(--hue) var(--hl-s) var(--hl-l));
  transition: opacity .2s, background-color .25s;
}
.seg.core {
  background: transparent;
  font-weight: 700;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: .22em;
  padding-left: 0; padding-right: 0;
}
.seg.t-ic {
  background: var(--comp-bg);
  font-weight: 600;
  text-decoration: underline dashed;
  text-decoration-thickness: 2px;
  text-underline-offset: .22em;
}
.seg.t-cverb {
  background: var(--comp-bg);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: .22em;
}
.seg .join { color: var(--accent); font-weight: 800; }
.seg.sel { box-shadow: 0 0 0 2px var(--ink); }
.seg.core.sel { box-shadow: none; text-decoration-color: var(--accent); }
.seg.enter { animation: ink-in .5s ease-out; }
.seg.leave { opacity: 0; text-decoration: line-through; }
@keyframes ink-in {
  0% { opacity: 0; letter-spacing: -.04em; }
  60% { opacity: 1; }
  100% { letter-spacing: 0; }
}
/* Spot mode: every part looks the same until found */
.seg.blind, .seg.core.blind, .seg.t-ic.blind, .seg.t-cverb.blind {
  background: transparent; font-weight: 400; text-decoration: none; padding-left: 0; padding-right: 0;
}
.seg.blind .join { color: inherit; font-weight: inherit; }
.seg.blind:hover { background: var(--comp-bg); }
.seg.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.seg.shake { display: inline-block; }

.t-intro { --hue: 50; } .t-dep { --hue: 22; } .t-app { --hue: 335; } .t-rel { --hue: 270; }
.t-par { --hue: 130; } .t-adj { --hue: 198; } .t-adv { --hue: 230; } .t-prep { --hue: 168; }
.t-part { --hue: 88; } .t-inf { --hue: 300; } .t-abs { --hue: 2; }

.status {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;
  margin-top: 14px; padding-top: 12px; border-top: 1.5px dashed var(--line);
  font-size: .92rem; color: var(--muted);
}
.status strong {
  color: var(--ink); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .8rem;
  border: 1.5px solid var(--ink); border-radius: 4px; padding: 2px 7px;
}
.status .count { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Parts tray */
.tray-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
h2 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -.01em; }
.bulk { display: flex; gap: 8px; }
.bulk button, .card button, .spot button.plain {
  border: 1.5px solid var(--ink); background: transparent; border-radius: 8px;
  padding: 6px 12px; font-size: .88rem; font-weight: 600;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: stretch; }
.group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 4px; }
.opts { display: inline-flex; flex-wrap: wrap; gap: 4px; padding-right: 4px; }
.opts button {
  border: 1.5px solid var(--line); background: var(--sheet); border-radius: 8px;
  min-height: 36px; padding: 4px 10px; font-size: .88rem; font-weight: 600; white-space: nowrap;
}
.opts button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1.5px solid var(--line); background: var(--sheet);
  border-radius: 10px; padding: 9px 12px 9px 10px;
  font-weight: 600; font-size: .95rem; min-height: 44px;
}
.chip .dot { width: 14px; height: 14px; border-radius: 4px; background: hsl(var(--hue) var(--dot-s) var(--dot-l)); flex: none; }
.chip.t-ic .dot { background: transparent; border: 2px dashed var(--muted); }
.chip.t-cverb .dot { background: var(--ink); }
.chip .sign { font-weight: 800; width: 1ch; text-align: center; color: var(--muted); }
.chip[aria-pressed="true"] { background: hsl(var(--hue) var(--hl-s) var(--hl-l)); border-color: var(--ink); }
.chip.t-ic[aria-pressed="true"], .chip.t-cverb[aria-pressed="true"] { background: var(--comp-bg); }
.chip[aria-pressed="true"] .sign { color: var(--ink); }

/* Explanation card */
.card {
  background: var(--sheet); border: 1.5px solid var(--line); border-left: 6px solid var(--ink);
  border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.card.typed { border-left-color: hsl(var(--hue) var(--dot-s) var(--dot-l)); }
.card.t-ic, .card.t-cverb { border-left-color: var(--muted); }
.card .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 { margin: 0; font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
.card q { font-family: var(--font-sentence); font-size: 1.1rem; quotes: "\201C" "\201D"; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; max-width: 65ch; }
.card dt { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 3px; }
.card dd { margin: 0; }
@media (max-width: 460px) { .card dl { grid-template-columns: 1fr; gap: 2px; } .card dd { margin-bottom: 6px; } }

/* Spot mode */
.spot { display: flex; flex-direction: column; gap: 10px; }
.spot .ask { font-size: clamp(1.25rem, 4vw, 1.6rem); font-weight: 800; letter-spacing: -.02em; margin: 0; }
.spot .fb { min-height: 1.5em; margin: 0; font-weight: 600; }
.spot .fb.good { color: var(--good); } .spot .fb.bad { color: var(--bad); }
.spot .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spot .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
.spot button.solid { border: 1.5px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; font-size: .88rem; font-weight: 600; }

/* Error states */
.seg.err { text-decoration: underline wavy var(--bad); text-decoration-thickness: 2px; text-underline-offset: .22em; }
.seg .join.err, .caret { color: var(--bad); font-weight: 800; }
.opts button.bad { border-style: dashed; border-color: var(--bad); color: var(--bad); }
.opts button.bad[aria-pressed="true"] { background: var(--bad); border-style: solid; color: var(--sheet); }
.status strong.bad { color: var(--bad); border-color: var(--bad); }

/* Subject and verb marks */
.sv { border-radius: 4px; padding: 0 .12em; text-decoration: none; display: inline-block; line-height: 1.25; }
.sv.s { box-shadow: inset 0 0 0 2px var(--ink); }
.sv.v { background: var(--ink); color: var(--sheet); }
.sv::after { font-family: var(--font-display); font-weight: 800; font-size: .42em; vertical-align: super; margin-left: .2em; }
.sv.s::after { content: "S"; } .sv.v::after { content: "V"; }
.svbtn { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: .82rem; font-weight: 600; color: var(--ink); }
.svbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }

/* Header tools and settings */
.tools { display: flex; align-items: center; gap: 8px; }
.gear { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; width: 38px; height: 38px; font-size: 1.1rem; line-height: 1; }
.gear[aria-expanded="true"] { background: var(--ink); color: var(--sheet); }
.settings { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.settings label { display: flex; gap: 10px; align-items: flex-start; }
.settings input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.settings small { display: block; color: var(--muted); }

/* Practice */
.subnav { display: flex; flex-wrap: wrap; gap: 6px; }
.subnav button { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 12px; font-size: .92rem; font-weight: 600; }
.subnav button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.goal { border: 1.5px dashed var(--ink); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.goal .eyebrow, .write .eyebrow { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.goal p { margin: 0; font-family: var(--font-sentence); font-size: clamp(1.05rem, 3vw, 1.3rem); line-height: 1.5; }
.goal .row, .write .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.goal .left { font-weight: 800; } .goal .left.done { color: var(--good); }
.goal button, .write button { border: 1.5px solid var(--ink); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: .88rem; font-weight: 600; }
.write { display: flex; flex-direction: column; gap: 10px; }
.write .newcore { font-family: var(--font-sentence); font-size: clamp(1.2rem, 3.6vw, 1.6rem); font-weight: 700; margin: 0; }
.write textarea { width: 100%; min-height: 6.5em; font-family: var(--font-sentence); font-size: 1.15rem; line-height: 1.5; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--sheet); color: var(--ink); resize: vertical; }
.write ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.write li label { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.write li input { width: 18px; height: 18px; accent-color: var(--accent); }
.write .dot { width: 12px; height: 12px; border-radius: 3px; background: hsl(var(--hue) var(--dot-s) var(--dot-l)); }
.write .t-ic .dot, .write .t-cverb .dot { background: var(--muted); }
.write .note { color: var(--muted); margin: 0; }

/* Presentation view */
.present .wrap { max-width: 1240px; }
.present .sentence { font-size: clamp(1.8rem, 5.2vw, 3.5rem); }
.present .card { font-size: 1.15rem; }

[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .seg, .seg.enter, .seg.shake { animation: none; transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sentence Builder</h1>
    <div class="tools">
      <div class="tabs" role="tablist" aria-label="Mode">
        <button id="tab-build" role="tab" aria-selected="true">Build</button>
        <button id="tab-practice" role="tab" aria-selected="false">Practice</button>
      </div>
      <button class="gear" id="btn-gear" aria-label="Teacher settings" aria-expanded="false" title="Teacher settings">⚙</button>
    </div>
  </header>

  <section class="settings" id="settings" hidden aria-label="Teacher settings">
    <label for="set-errors"><input type="checkbox" id="set-errors"><span>Show error options<small>Adds comma splice and run-on to the joiner choices, and a wrong spot for some participial phrases.</small></span></label>
    <label for="set-present"><input type="checkbox" id="set-present"><span>Presentation view<small>Larger type for projecting.</small></span></label>
    <label for="set-predict"><input type="checkbox" id="set-predict"><span>Predict first<small>Tapping a part shows it and waits. Students guess where it goes and how to punctuate it, then you reveal.</small></span></label>
  </section>

  <div class="picker" id="picker" aria-label="Choose a sentence"><span class="lead">Sentence</span></div>

  <div class="subnav" id="subnav" hidden>
    <button id="act-spot">Spot the part</button>
    <button id="act-target">Build to a target</button>
    <button id="act-write">Your turn</button>
  </div>

  <section class="goal" id="goal" hidden>
    <span class="eyebrow">Target sentence</span>
    <p id="goal-text"></p>
    <div class="row"><span class="left" id="goal-left"></span><button id="btn-newgoal">New target</button></div>
  </section>

  <section class="sheet" aria-label="Sentence">
    <p class="sentence" id="sentence" aria-live="polite"></p>
    <p class="sentence measure" id="measure" aria-hidden="true"></p>
    <div class="status" id="status"></div>
  </section>

  <section id="build-panel">
    <div class="tray-head">
      <h2 id="tray-title">Tap a part to add it. Tap again to take it out. Dashed boxes have choices.</h2>
      <div class="bulk">
        <button id="btn-strip">Strip to core</button>
        <button id="btn-all">Add everything</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="spot" id="spot-panel" hidden>
    <p class="ask" id="ask"></p>
    <p class="fb" id="fb"></p>
    <div class="row">
      <span class="progress" id="progress"></span>
      <button class="plain" id="btn-show">Show me</button>
      <button class="plain" id="btn-again" hidden>Go again</button>
      <button class="solid" id="btn-next" hidden>Next sentence</button>
    </div>
  </section>

  <section class="write" id="write-panel" hidden>
    <span class="eyebrow">Your new core</span>
    <p class="newcore" id="newcore"></p>
    <p class="note" id="write-note"></p>
    <ul id="write-parts"></ul>
    <textarea id="write-text" aria-label="Your sentence" placeholder="Write your sentence here."></textarea>
    <div class="row"><button id="btn-core">Different core</button><button id="btn-copy">Copy my sentence</button><span class="note" id="copy-msg"></span></div>
  </section>
</div>

<script>
/*LOGIC*/
const TYPES = {
  intro: { name: "Introductory phrase", what: "A phrase that sets the scene before the main clause starts. It has no subject and verb of its own.", punct: "Put a comma after it." },
  dep:   { name: "Dependent clause", what: "A group of words with its own subject and verb that still can't stand alone, because it starts with a word like because, while, although, or unless." },
  app:   { name: "Appositive", what: "A noun phrase that renames the noun right beside it.", punct: "It is extra information, so it gets a comma on each side." },
  rel:   { name: "Relative clause", what: "A clause that describes a noun. It starts with who, which, or that." },
  par:   { name: "Parenthetical", what: "An aside. The writer steps outside the sentence for a moment to comment on it." },
  adj:   { name: "Adjective", what: "A single word that describes a noun.", punct: "No punctuation needed." },
  adv:   { name: "Adverb", what: "A single word that describes the verb. It tells how, when, or how often.", punct: "No punctuation needed." },
  prep:  { name: "Prepositional phrase", what: "A preposition plus its object. It tells where, when, or how.", punct: "No comma when it comes right after what it describes." },
  part:  { name: "Participial phrase", what: "A phrase built on a verb form (usually ending in -ing or -ed) that works like an adjective.", punct: "Set it off with a comma. The noun it describes must be clear, or the phrase dangles." },
  inf:   { name: "Infinitive phrase", what: "To plus a verb, along with the words that complete it. It often tells why.", punct: "At the front of the sentence, put a comma after it. At the end, no comma." },
  abs:   { name: "Absolute phrase", what: "A noun plus a participle, with no full verb. It describes the whole scene instead of a single word.", punct: "Set it off with a comma." },
  cverb: { name: "Compound verb", what: "A second verb for the same subject, joined with and.", punct: "No comma, because there is no new subject. Compare it with an added independent clause, which brings its own subject and needs a comma." },
  ic:    { name: "Independent clause", what: "A complete thought with its own subject and verb. It could be a sentence by itself." }
};
const JOIN_RULE = {
  cc: "Comma, then a coordinating conjunction (for, and, nor, but, or, yet, so).",
  semi: "A semicolon alone can join two closely related independent clauses. No conjunction needed.",
  ca: "Semicolon before the conjunctive adverb, comma after it.",
  colon: "A colon works when the second clause explains or completes the first."
};
const JOIN_EFFECT = {
  cc: "The conjunction names the relationship for the reader: addition, contrast, or result.",
  semi: "The reader has to infer the connection. The two clauses feel tight and balanced.",
  ca: "The logic is spelled out. This is the most formal choice.",
  colon: "The first clause makes a promise and the second one pays it off."
};
const ERR = {
  splice: ["Comma splice", "A comma alone is too weak to join two independent clauses.", "Add a conjunction after the comma, switch to a semicolon, or split it into two sentences."],
  runon: ["Run-on", "Two independent clauses run together with nothing joining them.", "Join them with a comma and conjunction, a semicolon, or a period."],
  misplaced: ["Misplaced modifier", "The participial phrase sits beside the wrong noun.", "Move the phrase back beside the noun it describes."]
};
const NEW_CORES = ["The team lost the game.", "The teacher dropped the marker.", "Rain flooded the street.", "My brother burned the toast.", "The phone buzzed.", "The crowd left the stadium.", "A stranger opened the door.", "The wifi crashed."];
// Subject and verb inside each clause (and the verb of each compound verb).
const SV = {
  "because he loved the game": ["he", "loved"], "the cat watched from the fence": ["cat", "watched"], "that Maya had thrown": ["Maya", "had thrown"],
  "because her alarm never rang": ["alarm", "rang"], "she walked to school": ["she", "walked"], "her teacher marked her tardy": ["teacher", "marked"],
  "which sits high on Ridge Road": ["which", "sits"], "the teachers still posted homework": ["teachers", "posted"],
  "who grew up in Oaxaca": ["who", "grew"], "the whole house smelled like heaven": ["house", "smelled"],

  const box = $("chips"), e = errs();
  box.textContent = "";
  optional(sent).forEach(i => {
    const g = sent.segs[i];
    const b = document.createElement("button");
    b.className = "chip t-" + g.t;
    b.id = "chip-" + i;
    b.setAttribute("aria-pressed", on.has(i));
    b.innerHTML = '<span class="dot"></span><span class="lbl"></span><span class="sign" aria-hidden="true"></span>';
    b.querySelector(".lbl").textContent = label(g, sent);
    b.querySelector(".sign").textContent = on.has(i) ? "−" : "+";
    b.addEventListener("click", () => toggle(i));
    const c = choices(g, e);
    if (!c) { box.append(b); return; }
    const grp = document.createElement("div"); grp.className = "group";
    const os = document.createElement("div"); os.className = "opts"; os.setAttribute("role", "group");
    os.setAttribute("aria-label", g.t === "ic" ? "Join with" : g.t === "par" ? "Punctuation" : "Position");
    const now = choice(sent, opt, i, e);
    c.forEach(([key, text]) => {
      const ob = document.createElement("button");
      ob.id = "opt-" + i + "-" + key;
      ob.textContent = text;
      if (text.charAt(0) === "✗") ob.className = "bad";
      ob.setAttribute("aria-pressed", on.has(i) && now === key);
      ob.addEventListener("click", () => choose(i, key));
      os.append(ob);
    });
    grp.append(b, os);
    box.append(grp);
  });
}

function renderCard(sent, on, opt) {
  const card = $("card");
  card.textContent = "";
  const rows = [];
  const top = document.createElement("div"); top.className = "top";
  const h = document.createElement("h3");
  top.append(h);
  if (state.sel === "core" || state.sel === undefined) {
    card.className = "card";
    h.textContent = "The core (independent clause 1)";
    rows.push(["Text", null, sent.core],
      ["What it is", "An independent clause: a subject and a verb that make a complete thought. Subject: " + sent.subj + ". Verb: " + sent.verb + "."],
      ["Why it matters", "Every part you add hangs on this. Take all of them away and the sentence still stands. Take the core away and it falls apart."]);
  } else {
    const g = sent.segs[state.sel], T = TYPES[g.t], c = choice(sent, opt, state.sel, errs());
    card.className = "card typed t-" + g.t;
    h.textContent = label(g, sent);
    const btn = document.createElement("button");
    if (state.pending === state.sel) {
      btn.textContent = "Reveal";
      btn.addEventListener("click", () => { state.pending = null; addPart(state.sel); render(state.sel); });
      top.append(btn);
      rows.push(["Text", null, g.x], ["Predict", "Where does this go in the sentence? What punctuation will it need?"]);
    } else {
      btn.textContent = on.has(state.sel) ? "Take it out" : "Add it";
      btn.addEventListener("click", () => toggle(state.sel));
      top.append(btn);
      rows.push(["Text", null, g.x], ["What it is", T.what], ["Here", g.note]);
      const e = c === "splice" || c === "runon" ? c : c === "wrong" ? "misplaced" : null;
      if (e) {
        rows.push(["Problem", ERR[e][0] + ". " + (e === "misplaced" ? g.wrong.why : ERR[e][1])], ["Fix", ERR[e][2]]);
      } else {
        let punct = g.punct || T.punct, effect = "";
        if (g.t === "ic") { punct = JOIN_RULE[g.joins[+c][0]]; effect = JOIN_EFFECT[g.joins[+c][0]]; }
        if (g.t === "par") punct = PAR_RULE[c];
        if (g.t === "dep" && g.move) {
          punct = c === "front" ? "It comes first, so a comma marks where the main clause begins."
            : g.bo ? "After the main clause you usually need no comma. A clause of contrast (although, even though) is the exception." : "It follows the main clause, so no comma is needed.";
          effect = c === "front" ? "The reader waits for the main clause, so the main point lands last and hits hardest."
            : "The main point comes first. The clause trails behind as an explanation.";
        }
        if (punct) rows.push(["Punctuation", punct]);
        if (effect) rows.push(["Effect", effect]);
      }
    }
  }
  card.append(top);
  const dl = document.createElement("dl");
  rows.forEach(([k, v, quote]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd");
    if (quote) { const q = document.createElement("q"); q.textContent = quote; dd.append(q); } else dd.textContent = v;
    dl.append(dt, dd);
  });
  card.append(dl);
}

function addPart(i) {
  const sent = cur(), list = work().on, g = sent.segs[i];
  if (!list.includes(i)) list.push(i);
  if (g.req) { const r = sent.segs.findIndex(x => x.key === g.req); if (r >= 0 && !list.includes(r)) list.push(r); }
}
function toggle(i) {
  const sent = cur(), w = work();
  state.sel = i;
  if (!w.on.includes(i)) {
    if (settings.predict && view() === "build" && state.pending !== i) { state.pending = i; render(); return; }
    state.pending = null; addPart(i); render(i); return;
  }
  const finish = () => {
    const g = sent.segs[i];
    w.on = w.on.filter(j => j !== i && !(g.key && sent.segs[j].req === g.key));
    render();
  };
  const sp = $("sentence").querySelector('[data-i="' + i + '"]');
  if (sp && !reduce) { sp.classList.add("leave"); setTimeout(finish, 200); } else finish();
}
function choose(i, key) {
  work().opt[i] = key;
  state.sel = i; state.pending = null;
  addPart(i);
  render(i);
}

/* Practice: spot the part */
function startSpot() {
  state.spot = { queue: [...shuffle(optional(cur())), "core"], found: [], fb: "", ok: true };
}
function renderSpot(sent) {
  if (!state.spot) startSpot();
  const sp = state.spot, found = new Set(sp.found), all = new Set(optional(sent));
  drawSentence($("sentence"), sent, compose(sent, all, state.w[state.si].opt, false), {
    interactive: true,
    blind: p => p.t === "core" ? found.has("core") : found.has(p.i)
  });
  statusLine("", "The colors are hidden. Tap the words that match the prompt.");
  const target = sp.queue[0], total = optional(sent).length + 1, done = target === undefined;
  let ask;
  if (done) ask = "You found all " + total + " parts.";
  else if (target === "core") ask = "Last one. Tap the core of the sentence.";
  else if (sent.segs[target].t === "ic") ask = "Tap an independent clause that was added to the core.";
  else ask = "Tap the " + TYPES[sent.segs[target].t].name.toLowerCase() + ".";
  $("ask").textContent = ask;
  $("fb").textContent = sp.fb;
  $("fb").className = "fb " + (sp.ok ? "good" : "bad");
  $("progress").textContent = sp.found.length + " of " + total + " found";
  $("btn-show").hidden = done;
  $("btn-again").hidden = !done;
  $("btn-next").hidden = !done;
}
function spotTap(i, el) {
  const sp = state.spot, sent = cur(), target = sp.queue[0];
  if (target === undefined) return;
  const g = sent.segs[i];
  const already = g.t === "core" ? sp.found.includes("core") : sp.found.includes(i);
  const hit = !already && (target === "core" ? g.t === "core" : g.t === sent.segs[target].t);
  if (hit) {
    const id = target === "core" ? "core" : i;
    sp.queue.splice(sp.queue.indexOf(id), 1);
    sp.found.push(id);
    sp.fb = target === "core" ? "Yes. " + sent.core + " Everything else hangs on it." : "Yes. " + (g.note || "");
    sp.ok = true;
    render();
  } else {
    sp.fb = already ? "You already found that one." : "Not that one. Look again.";
    sp.ok = false;
    $("fb").textContent = sp.fb; $("fb").className = "fb bad";
    if (!reduce) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  }
}

/* Practice: build to a target */
function newTarget() {
  const sent = cur(), ids = shuffle(optional(sent));
  const on = ids.slice(0, Math.min(ids.length, 3 + Math.floor(Math.random() * 3)));
  on.slice().forEach(i => { const g = sent.segs[i]; if (g.req) { const r = sent.segs.findIndex(x => x.key === g.req); if (!on.includes(r)) on.push(r); } });
  const opt = {};
  on.forEach(i => { const c = choices(sent.segs[i], false); if (c) opt[i] = c[Math.floor(Math.random() * c.length)][0]; });
  state.tg = { goal: { on, opt }, w: { on: [], opt: {} } };
}
function renderTarget(sent, enter) {
  if (!state.tg) newTarget();
  const { goal, w } = state.tg, on = new Set(w.on);
  drawSentence($("sentence"), sent, compose(sent, on, w.opt, false), { interactive: false, enter });
  $("goal-text").textContent = plain(sent, new Set(goal.on), goal.opt, false);
  const n = distance(sent, goal, w);
  $("goal-left").textContent = n === 0 ? "Matched. You built it." : n === 1 ? "1 change to go" : n + " changes to go";
  $("goal-left").className = "left" + (n === 0 ? " done" : "");
  statusLine("", "Start from the core and build the target. Check the order and the punctuation.");
  $("tray-title").textContent = "Add parts and pick positions and joiners until your sentence matches the target.";
  renderChips(sent, on, w.opt);
}

/* Practice: your turn */
function renderWrite(sent) {
  const w = state.w[state.si], on = new Set(w.on), wr = state.write;
  drawSentence($("sentence"), sent, compose(sent, on, w.opt, false), {});
  statusLine("Model", on.size ? "This is the sentence you built. Use it as your pattern." : "Go to Build and add some parts to this sentence first. Then come back.");
  $("newcore").textContent = NEW_CORES[wr.core % NEW_CORES.length];
  $("write-note").textContent = on.size ? "Grow this core with the same parts as the model. Check each one off as you use it." : "";
  const ul = $("write-parts");
  ul.textContent = "";
  optional(sent).filter(i => on.has(i)).forEach(i => {
    const g = sent.segs[i], li = document.createElement("li"), lab = document.createElement("label"), cb = document.createElement("input");
    li.className = "t-" + g.t;
    cb.type = "checkbox"; cb.id = "wr-" + i; cb.checked = !!wr.checks[state.si + "-" + i];
    cb.addEventListener("change", () => { wr.checks[state.si + "-" + i] = cb.checked; });
    lab.htmlFor = cb.id;
    const dot = document.createElement("span"); dot.className = "dot";
    lab.append(cb, dot, TYPES[g.t].name);
    li.append(lab); ul.append(li);
  });
  if ($("write-text").value !== wr.text) $("write-text").value = wr.text;
  $("copy-msg").textContent = "";
}

/* Events */
function segEvent(e) {
  const el = e.target.closest(".seg");
  if (!el) return;
  if (e.type === "keydown") { if (e.key !== "Enter" && e.key !== " ") return; e.preventDefault(); }
  const i = +el.dataset.i, g = cur().segs[i], v = view();
  if (v === "spot") return spotTap(i, el);
  if (v !== "build") return;
  state.sel = g.t === "core" ? "core" : i; state.pending = null;
  render();
}
$("sentence").addEventListener("click", segEvent);
$("sentence").addEventListener("keydown", segEvent);
$("tab-build").addEventListener("click", () => { state.mode = "build"; render(); });
$("tab-practice").addEventListener("click", () => { state.mode = "practice"; state.spot = null; render(); });
["spot", "target", "write"].forEach(a => $("act-" + a).addEventListener("click", () => { state.act = a; state.spot = null; render(); }));
$("btn-strip").addEventListener("click", () => { work().on = []; state.sel = "core"; state.pending = null; render(); });
$("btn-all").addEventListener("click", () => { work().on = optional(cur()); state.pending = null; render(); });
$("btn-show").addEventListener("click", () => {
  const sp = state.spot, sent = cur(), t = sp.queue.shift();
  sp.found.push(t);
  sp.fb = t === "core" ? "The core is: " + sent.core : "Here it is: " + sent.segs[t].x + ".";
  sp.ok = true; render();
});
$("btn-again").addEventListener("click", () => { state.spot = null; render(); });
$("btn-next").addEventListener("click", () => pick((state.si + 1) % SENTENCES.length));
$("btn-newgoal").addEventListener("click", () => { newTarget(); render(); });
$("write-text").addEventListener("input", e => { state.write.text = e.target.value; });
$("btn-core").addEventListener("click", () => { state.write.core++; render(); });
$("btn-copy").addEventListener("click", () => {
  const done = ok => { $("copy-msg").textContent = ok ? "Copied." : "Copy didn't work here. Select the text and copy it yourself."; };
  try { navigator.clipboard.writeText(state.write.text).then(() => done(true), () => done(false)); } catch (e) { done(false); }
});
$("btn-gear").addEventListener("click", () => {
  const open = $("settings").hidden;
  $("settings").hidden = !open;
  $("btn-gear").setAttribute("aria-expanded", open);
});
["errors", "present", "predict"].forEach(k => {
  $("set-" + k).checked = settings[k];
  $("set-" + k).addEventListener("change", e => { settings[k] = e.target.checked; state.pending = null; saveSettings(); render(); reserveHeight(); });
});
function pick(i) { state.si = i; state.sel = "core"; state.pending = null; state.spot = null; state.tg = null; reserveHeight(); render(); }

let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(reserveHeight, 150); });

function start(saved) {
  state = { si: 0, w: SENTENCES.map(() => ({ on: [], opt: {} })), mode: "build", act: "spot", sel: "core", sv: false, pending: null, spot: null, tg: null, write: { core: 0, text: "", checks: {} } };
  if (saved && Array.isArray(saved.w) && saved.w.length === SENTENCES.length) {
    state.si = Math.min(saved.si | 0, SENTENCES.length - 1); state.w = saved.w; state.sv = !!saved.sv;
    state.mode = saved.mode === "practice" ? "practice" : "build";
    if (["spot", "target", "write"].includes(saved.act)) state.act = saved.act;
    if (saved.write) state.write = saved.write;
  }
  SENTENCES.forEach((s, i) => {
    const b = document.createElement("button");
    b.id = "pick-" + i;
    b.textContent = i + 1;
    b.title = s.core;
    b.setAttribute("aria-label", "Sentence " + (i + 1) + ": " + s.core);
    b.addEventListener("click", () => pick(i));
    $("picker").append(b);
  });
  document.body.classList.toggle("present", settings.present);
  reserveHeight();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reserveHeight);
}
window.claude?.hot?.snapshot?.(() => ({ si: state.si, w: state.w, mode: state.mode, act: state.act, sv: state.sv, write: state.write }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body>
